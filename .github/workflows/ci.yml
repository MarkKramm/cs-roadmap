name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint content
        run: node scripts/lint-content.mjs
      - name: Audit phase structure
        run: node scripts/audit-content.mjs
      - name: Audit lesson parser (no content loss)
        run: node scripts/audit-lesson-ast.mjs
      - name: Audit readability
        run: node scripts/audit-readability.mjs
      # A comprehension audit found defects no existing guard could see: text
      # sending the reader to a "Part 5" that is really Part 4, or to a "Part 8"
      # that does not exist at all. Those are arithmetic on the text, so a script
      # holds the line where a prose scan could not. The one judgement class it
      # computes (a forward phase cited as prior knowledge) is printed but does
      # not gate — see the comment in the script.
      - name: Audit cross-references
        run: node scripts/audit-refs.mjs
      # The second pass of the comprehension audit found the same defect class it
      # always finds: a total stated in one place that disagrees with its own
      # breakdown table elsewhere — a phase claiming 60-80 hours over parts
      # summing to 40-56, a header calling itself the heaviest when a later phase
      # budgets three times as much, a track overview listing 4 weeks while every
      # phase file it points at says 6. Every instance came from an edit that
      # changed one place and not the other, so the check is arithmetic, not
      # judgement, and it gates.
      - name: Audit time budgets
        run: node scripts/audit-time-budget.mjs
      # cyber-restructure-check.mjs is deliberately NOT run here. It compares the
      # cyber phases against a "before" snapshot captured at the start of the
      # 2026 restructure pass, and reads it from process.env.TEMP — a
      # machine-local file that is not in the repository. It therefore cannot
      # pass on a fresh clone, and running it in CI would only ever fail. It is
      # a one-off migration tool, not a standing guard. The perpetual guarantee
      # that content is not lost is audit-lesson-ast.mjs (parser drops nothing)
      # and the word counts in cyber-restructure-check's own baseline concept is
      # superseded by it.

  site:
    name: Learning site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run test:smoke
      - name: Search index and query engine
        run: npm run test:search
      # Query highlighting runs on the real module with no React needed, so it
      # is a plain node run rather than part of the render suite. A wrong span
      # here shows a correct result with the wrong word marked, which reads as a
      # broken search but never throws.
      - name: Search snippet highlighting
        run: npm run test:highlight
      # The rest of the suite. Every one of these is a plain node run against a
      # module with no React and no DOM, so they cost seconds and need no extra
      # install. They were written because their failure modes are silent — a
      # band table that offers a 90-minute task to someone with 30 minutes, an
      # answer attached to the wrong task, a merge that drops a record — and a
      # silent failure that only a local run can catch is a failure that ships.
      - name: UI logic
        run: npm run test:ui
      - name: Data transfer
        run: npm run test:data
      - name: Notes
        run: npm run test:notes
      - name: Your work
        run: npm run test:work
      - name: Today
        run: npm run test:today
      - name: Lesson search
        run: npm run test:lesson-search
      # The only step that needs a real browser engine. Everything above renders
      # to a string and asserts on markup, which cannot see layout, computed CSS,
      # focus survival or a media query — the six views this covers (notes panel,
      # dashboard rail, print stylesheet, Shared, Your work, time budget) were
      # verified structurally for their whole life until this step existed. The
      # preview server is started and torn down inside the step, because a
      # background process launched in an earlier step is not reliably still
      # listening in a later one.
      - name: Browser check (real engine)
        env:
          BROWSER_NO_SANDBOX: '1'
          BROWSER_CHECK_STRICT: '1'
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:4173/ >/dev/null; then
            echo "preview server never came up"
            cat /tmp/preview.log
            kill $PREVIEW_PID 2>/dev/null || true
            exit 1
          fi
          npm run test:browser
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS
