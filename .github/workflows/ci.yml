name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint content
        run: node scripts/lint-content.mjs
      - name: Audit phase structure
        run: node scripts/audit-content.mjs
      - name: Audit lesson parser (no content loss)
        run: node scripts/audit-lesson-ast.mjs
      - name: Audit readability
        run: node scripts/audit-readability.mjs
      # A comprehension audit found defects no existing guard could see: text
      # sending the reader to a "Part 5" that is really Part 4, or to a "Part 8"
      # that does not exist at all. Those are arithmetic on the text, so a script
      # holds the line where a prose scan could not. The one judgement class it
      # computes (a forward phase cited as prior knowledge) is printed but does
      # not gate — see the comment in the script.
      - name: Audit cross-references
        run: node scripts/audit-refs.mjs
      # The second pass of the comprehension audit found the same defect class it
      # always finds: a total stated in one place that disagrees with its own
      # breakdown table elsewhere — a phase claiming 60-80 hours over parts
      # summing to 40-56, a header calling itself the heaviest when a later phase
      # budgets three times as much, a track overview listing 4 weeks while every
      # phase file it points at says 6. Every instance came from an edit that
      # changed one place and not the other, so the check is arithmetic, not
      # judgement, and it gates.
      - name: Audit time budgets
        run: node scripts/audit-time-budget.mjs
      # The same structural defect appeared three times and nothing ever failed
      # because of it. Keep a Changelog permits ONE of each section heading per
      # release; `[Unreleased]` accumulated eleven — four `Fixed`, four `Changed`,
      # three `Added` — over at least four commits, so a reader had to read four
      # separate `Fixed` lists to find what changed. They were merged mechanically
      # in b9f6133, and the shape returned twice more on 2026-09-16, each time
      # because an entry was appended above an existing section of the same name
      # instead of into it.
      #
      # This gates where the topic-list guard could not (D-033): "does this
      # heading appear twice" is arithmetic on the document, so a failing result
      # is distinguishable from a passing one BY THE CHECK ITSELF. The guard
      # found a real fourth defect on its first run — `[0.1.0]` listed `Fixed`
      # before `Changed` — which is the evidence that it is capable of failing.
      - name: Audit CHANGELOG structure
        run: node scripts/audit-changelog.mjs
      # And the guard's own controls, because a check whose pass path looks like
      # its skip path is not a check. 13 fixtures: each defect class must exit 1
      # and name what it found, and three legitimate shapes (a release omitting
      # `Security`, a block with only one section, a prose-only release note)
      # must exit 0. Without this, a rewrite that silently stopped detecting
      # anything would print the same green line as a healthy corpus.
      - name: Audit CHANGELOG guard (self-test)
        run: node scripts/test-audit-changelog.mjs
      # The build fails on a malformed question — no marked answer, two marked
      # answers, a missing **Why:**, a duplicate id. What it CANNOT see is a
      # defect of the SET: the first quiz written for this repository put seven
      # of its ten correct answers in position C. Every question was
      # individually valid and the build was green, yet a reader answering "C"
      # every time scored 70% without reading the questions. That is a property
      # of the collection, so it needs a check that sees the whole set.
      - name: Audit quiz answer balance
        run: node scripts/audit-quiz.mjs
      # The corpus-level half of the same rule. A phase can balance perfectly
      # while the track is skewed -- it happened when the IT on-ramp was written
      # as seven quizzes at once, and every phase passed -- so the distribution
      # is now gated across all 31 phases rather than only printed. The controls
      # matter more than usual here: the first version of this rule was dead code
      # twice over, and still exited 1 in the probe scenario for an unrelated
      # per-phase reason, so a control that checked only the exit code would have
      # called it working.
      - name: Test corpus answer-balance controls
        run: node scripts/test-audit-quiz-corpus.mjs
      # The workflow that runs every other check had no check of its own. No YAML
      # parser is vendored, so a malformed step is invisible locally: CI would
      # fail to start, which reads as "no CI ran" rather than "CI is broken".
      # This verifies each step is well-formed, that no line uses a tab, and that
      # every `node scripts/...` and `npm run ...` the workflow names actually
      # exists — the failure mode where a guard is renamed and its CI step
      # silently points at nothing.
      - name: Validate CI workflow
        run: node scripts/validate-ci.mjs
      # Every other guard in this repository tests INTERNAL CONSISTENCY — does
      # the parser lose content, do cross-references resolve, does a table sum
      # to the number the prose claims. The comprehension passes test whether a
      # beginner can FOLLOW the text. Both are blind to a sentence that is
      # perfectly consistent, perfectly clear, and factually wrong.
      #
      # These two recompute what has a right answer independent of any source:
      # subnet arithmetic (RFC 1918 fixes the ranges; the rest is maths) and the
      # worked service-desk metrics in IT 06. Both are the strongest tier of
      # verification available, because they depend on trusting nobody's
      # documentation — not the author's, not a model's.
      - name: Verify subnetting arithmetic
        run: node scripts/verify-cidr.mjs
      - name: Verify worked metrics
        run: node scripts/verify-metrics.mjs
      # A claim-extraction pattern is a claim about the corpus, and it can be
      # wrong in both directions. The DNS-record pattern matched "A record of
      # what was done" (ordinary English) and MISSED "nslookup google.com # the
      # A record" (a real DNS claim) — and tightening it for the first fault
      # caused the second. An output count cannot tell you which way it is
      # wrong; a truth table can. This asserts all twelve known cases.
      - name: Test claim-extraction patterns
        run: node scripts/test-record-pattern.mjs
      # AGENTS.md rule 2 requires UTF-8 without BOM and real typographic
      # characters, and nothing checked it. A `Set-Content -Encoding utf8` wrote
      # a BOM plus mojibake into IT 02 and into SESSION-LOG.md — the second
      # inside a sentence *describing* mojibake — and both were caught by luck
      # (a 198-line diff on a one-line change) rather than by a guard. The
      # detector checks the decidable property: a well-formed text file has no
      # BOM, no C1 control characters, and no U+FFFD. That catches
      # double-encoding a printable-signature scan cannot see.
      - name: Audit text encoding
        run: node scripts/audit-encoding.mjs
      - name: Test encoding-guard controls
        run: node scripts/test-audit-encoding.mjs
      # A versioned external standard gets summarised, the summary is accurate
      # when written, the standard is revised, and the summary silently becomes
      # false. Every other guard checks the text against ITSELF -- a document
      # that says "five functions" consistently, cleanly and readably is wrong
      # in a way none of them can reach. Cyber phase 01 taught five NIST CSF
      # functions when CSF 2.0 has six, in four places including a numbered
      # lesson table, while phase 13 said six correctly and nothing compared
      # the two. This checks claims whose current value was read from the
      # standard itself.
      - name: Audit versioned framework claims
        run: node scripts/audit-framework-claims.mjs
      - name: Test framework-claim controls
        run: node scripts/test-audit-framework-claims.mjs
      # audit-refs.mjs checks that a link RESOLVES. All three withdrawn NIST
      # publications below resolved perfectly -- a retired document still serves
      # HTTP 200. Resolution is not currency: SP 800-61 Rev. 2, SP 800-50 and
      # SP 800-63-3 were each live in the corpus while NIST's own page marked
      # them "Withdrawn on <date>. Superseded by <newer>". This reads that
      # status line. It fails only on a CONFIRMED withdrawal, never on network
      # noise, because failing on infrastructure teaches people to ignore it.
      - name: Audit NIST publications for withdrawal
        run: node scripts/audit-nist-current.mjs
      # A stale LESSON misinforms a reader. A stale ANSWER KEY tells a learner
      # they are WRONG for being right, which is the worst outcome a self-study
      # curriculum can produce. The 2021->2025 OWASP renumbering moved six of
      # ten categories, so any quiz that binds a category NUMBER to a category
      # NAME may now have a wrong key. Checked separately from the lesson text
      # because a quiz is the one place the corpus asserts an answer.
      - name: Audit quiz answer keys for stale OWASP numbering
        run: node scripts/audit-quiz-owasp.mjs
      - name: Test quiz answer-key controls
        run: node scripts/test-audit-quiz-owasp.mjs
      # Twenty phases gained a quiz in one pass, which is exactly the situation
      # where a question gets written about the wrong phase, or invented rather
      # than read. `audit-quiz` gates whether a quiz is structurally valid; this
      # gates whether each question is *sourced from its own phase*, by checking
      # that a question's distinctive vocabulary matches the phase it lives in
      # better than any other phase. Every rule has a must-fail control.
      - name: Audit quiz sourcing
        run: node scripts/audit-quiz-sourcing.mjs
      - name: Test quiz-sourcing controls
        run: node scripts/test-audit-quiz-sourcing.mjs
      # A command can be named correctly and written wrongly. IT 02 stated DISM
      # in full at one place and abbreviated it to `DISM /RestoreHealth` in a
      # summary table 300 lines later — a form that throws if a beginner types
      # it. Nothing was inconsistent and nobody lied; a table cell invites
      # shortening, and the abbreviation silently became a broken command.
      # This checks the exact string a reader would copy, not the command name.
      - name: Audit abbreviated commands
        run: node scripts/audit-commands.mjs
      # The acronym audit prints a report and exits 0 whatever it finds: whether
      # a reader can decode "SSID" without help is a judgement about the reader,
      # not a claim about the text agreeing with itself, so by D-022 it is a
      # measurement and not a gate. Its DETECTOR, though, is a claim about the
      # text, and that part was silently broken — emphasis-wrapped definitions
      # (`**SPF** (Sender Policy Framework)`), a noun between term and gloss
      # (`CIDR notation (Classless Inter-Domain Routing)`), table-cell
      # expansions, and an em-dash inside a gloss were all reported as "never
      # explained" while printing the explanation as the evidence.
      #
      # So `--self-test` gates the instrument and nothing else: 16 controls, a
      # failure stops the run before any finding prints. Deliberately NOT
      # `node scripts/audit-terms.mjs` — that form always exits 0, and wiring it
      # here would add a check whose pass path is indistinguishable from never
      # having run.
      - name: Audit acronym detector (self-test)
        run: node scripts/audit-terms.mjs --self-test
      # cyber-restructure-check.mjs is deliberately NOT run here. It compares the
      # cyber phases against a "before" snapshot captured at the start of the
      # 2026 restructure pass, and reads it from process.env.TEMP — a
      # machine-local file that is not in the repository. It therefore cannot
      # pass on a fresh clone, and running it in CI would only ever fail. It is
      # a one-off migration tool, not a standing guard. The perpetual guarantee
      # that content is not lost is audit-lesson-ast.mjs (parser drops nothing)
      # and the word counts in cyber-restructure-check's own baseline concept is
      # superseded by it.

  site:
    name: Learning site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run test:smoke
      - name: Search index and query engine
        run: npm run test:search
      # Query highlighting runs on the real module with no React needed, so it
      # is a plain node run rather than part of the render suite. A wrong span
      # here shows a correct result with the wrong word marked, which reads as a
      # broken search but never throws.
      - name: Search snippet highlighting
        run: npm run test:highlight
      # renderInline is the site's whole inline-Markdown story and it had a real
      # bug: emphasis and code were matched in one alternation, so a code span
      # whose content contained an asterisk — the curriculum's quoted `"*"` in a
      # key policy — shredded both spans and leaked a literal backtick into the
      # page. smoke-render caught it on the one lesson that wrote that shape.
      # This holds the RULE instead of the corpus, so the next lesson to write it
      # is covered before anyone runs a full render.
      - name: Inline Markdown formatting
        run: npm run test:render-inline
      # The rest of the suite. Every one of these is a plain node run against a
      # module with no React and no DOM, so they cost seconds and need no extra
      # install. They were written because their failure modes are silent — a
      # band table that offers a 90-minute task to someone with 30 minutes, an
      # answer attached to the wrong task, a merge that drops a record — and a
      # silent failure that only a local run can catch is a failure that ships.
      - name: UI logic
        run: npm run test:ui
      - name: Data transfer
        run: npm run test:data
      - name: Notes
        run: npm run test:notes
      - name: Your work
        run: npm run test:work
      - name: Today
        run: npm run test:today
      - name: Lesson search
        run: npm run test:lesson-search
      # One phase carried to another machine, keyed by id rather than position.
      # Narrowing a whole-profile export down to one phase is where a filter can
      # silently drop a note or drag a second phase's progress along, and the
      # import reports success either way. Additive by construction, asserted.
      - name: Single-phase transfer
        run: npm run test:phase-transfer
      # "Where you've been" is the page most able to become a completion-scold,
      # which the design system forbids. Its rows carry no `remaining` or
      # `percent` field at all, so the no-denominator rule is a property of the
      # data rather than of the rendering — asserted here so a rewrite cannot
      # quietly reintroduce a score.
      - name: Path order
        run: npm run test:path-order
      # The quiz's scoring maths, under plain Node. Its failure modes are all
      # quiet: a question marked correct against the wrong option, an
      # unanswered question counted as wrong, or the "which to reread" numbers
      # off by one — none of which throw, and each of which makes a broken quiz
      # look exactly like a working one.
      - name: Quiz scoring
        run: npm run test:quiz
      # The review queue's data layer. Its failure modes are the quietest in the
      # repository: a question collected that should not be tells a reader to
      # revisit something they already know, and one NOT collected hides a real
      # gap. Neither throws, neither shows up in a smoke render, and both make
      # the page actively misleading. Every assertion here was checked by
      # mutation testing -- the first version of the "unanswered is not a gap"
      # rule passed while the guard enforcing it was deleted.
      - name: Review queue
        run: npm run test:review

  # The only job that needs a real browser engine. Everything in `site` renders to
  # a string and asserts on markup, which cannot see layout, computed CSS, focus
  # survival or a media query — the six views this covers (notes panel, dashboard
  # rail, print stylesheet, Shared, Your work, time budget) were verified
  # structurally for their whole life until this job existed.
  #
  # WHY THIS IS NOT A FIREFOX MATRIX, WHICH IS WHAT IT WAS FOR ONE COMMIT
  # Firefox was added here as a second leg and the leg failed on its first run.
  # The cause is not a bug in this repository: **Mozilla removed Firefox's CDP
  # implementation.** Its own documentation states, under `remote.active-protocols`:
  # "With the end of the CDP support, WebDriver BiDi is the only available
  # protocol, and the preference was removed in Firefox 141." `--remote-debugging-port`
  # therefore no longer exposes a CDP endpoint that `Browser.getVersion` can talk to,
  # so driving Firefox requires WebDriver BiDi — a different protocol with different
  # framing, not a flag change.
  #
  # **The leg was removed rather than left failing or quietly made optional.** A
  # permanently red job trains a reader to ignore CI, and a leg that silently
  # skipped when Firefox was missing would report a green Firefox result for an
  # engine that never started. The honest state is that this repository verifies
  # Chromium, and that Gecko and WebKit are a known, named gap.
  #
  # The engine-selection code in browser-check.mjs is kept, not deleted, and is
  # still exercised: `BROWSER_ENGINE` names an engine, and a named engine that
  # cannot be found FAILS rather than falling through to the other one. That guard
  # was written for the Firefox leg and is what made this failure legible instead
  # of silent — it reported "no browser found" and exited 1, rather than measuring
  # Chromium and calling it Firefox. It remains the contract any future leg must
  # satisfy, whether that leg arrives as BiDi or as a WebKit runner.
  browser:
    name: Browser check (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # ubuntu-latest ships Chrome preinstalled, but not necessarily at a path the
      # script looks in, and a runner image change could move it. Installing it
      # makes the precondition explicit rather than inherited — and the script
      # still fails loudly if the engine is not where it should be, so this cannot
      # paper over a missing browser either.
      - name: Ensure chromium is present
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium
          which google-chrome || which chromium || which chromium-browser || true
      # The preview server is started and torn down inside the step, because a
      # background process launched in an earlier step is not reliably still
      # listening in a later one.
      - name: Browser check (real engine)
        env:
          BROWSER_NO_SANDBOX: '1'
          BROWSER_CHECK_STRICT: '1'
          BROWSER_ENGINE: chromium
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:4173/ >/dev/null; then
            echo "preview server never came up"
            cat /tmp/preview.log
            kill $PREVIEW_PID 2>/dev/null || true
            exit 1
          fi
          npm run test:browser
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS
