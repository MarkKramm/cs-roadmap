name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint content
        run: node scripts/lint-content.mjs
      - name: Audit phase structure
        run: node scripts/audit-content.mjs
      - name: Audit lesson parser (no content loss)
        run: node scripts/audit-lesson-ast.mjs
      - name: Audit readability
        run: node scripts/audit-readability.mjs
      - name: Verify no cyber phase shrank
        run: node scripts/cyber-restructure-check.mjs

  site:
    name: Learning site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run test:smoke
      - name: Search index and query engine
        run: npm run test:search
