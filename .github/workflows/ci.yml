name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint content
        run: node scripts/lint-content.mjs
      - name: Audit phase structure
        run: node scripts/audit-content.mjs
      - name: Audit lesson parser (no content loss)
        run: node scripts/audit-lesson-ast.mjs
      - name: Audit readability
        run: node scripts/audit-readability.mjs
      # A comprehension audit found defects no existing guard could see: text
      # sending the reader to a "Part 5" that is really Part 4, or to a "Part 8"
      # that does not exist at all. Those are arithmetic on the text, so a script
      # holds the line where a prose scan could not. The one judgement class it
      # computes (a forward phase cited as prior knowledge) is printed but does
      # not gate — see the comment in the script.
      - name: Audit cross-references
        run: node scripts/audit-refs.mjs
      # The second pass of the comprehension audit found the same defect class it
      # always finds: a total stated in one place that disagrees with its own
      # breakdown table elsewhere — a phase claiming 60-80 hours over parts
      # summing to 40-56, a header calling itself the heaviest when a later phase
      # budgets three times as much, a track overview listing 4 weeks while every
      # phase file it points at says 6. Every instance came from an edit that
      # changed one place and not the other, so the check is arithmetic, not
      # judgement, and it gates.
      - name: Audit time budgets
        run: node scripts/audit-time-budget.mjs
      # The acronym audit prints a report and exits 0 whatever it finds: whether
      # a reader can decode "SSID" without help is a judgement about the reader,
      # not a claim about the text agreeing with itself, so by D-022 it is a
      # measurement and not a gate. Its DETECTOR, though, is a claim about the
      # text, and that part was silently broken — emphasis-wrapped definitions
      # (`**SPF** (Sender Policy Framework)`), a noun between term and gloss
      # (`CIDR notation (Classless Inter-Domain Routing)`), table-cell
      # expansions, and an em-dash inside a gloss were all reported as "never
      # explained" while printing the explanation as the evidence.
      #
      # So `--self-test` gates the instrument and nothing else: 16 controls, a
      # failure stops the run before any finding prints. Deliberately NOT
      # `node scripts/audit-terms.mjs` — that form always exits 0, and wiring it
      # here would add a check whose pass path is indistinguishable from never
      # having run.
      - name: Audit acronym detector (self-test)
        run: node scripts/audit-terms.mjs --self-test
      # cyber-restructure-check.mjs is deliberately NOT run here. It compares the
      # cyber phases against a "before" snapshot captured at the start of the
      # 2026 restructure pass, and reads it from process.env.TEMP — a
      # machine-local file that is not in the repository. It therefore cannot
      # pass on a fresh clone, and running it in CI would only ever fail. It is
      # a one-off migration tool, not a standing guard. The perpetual guarantee
      # that content is not lost is audit-lesson-ast.mjs (parser drops nothing)
      # and the word counts in cyber-restructure-check's own baseline concept is
      # superseded by it.

  site:
    name: Learning site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run test:smoke
      - name: Search index and query engine
        run: npm run test:search
      # Query highlighting runs on the real module with no React needed, so it
      # is a plain node run rather than part of the render suite. A wrong span
      # here shows a correct result with the wrong word marked, which reads as a
      # broken search but never throws.
      - name: Search snippet highlighting
        run: npm run test:highlight
      # renderInline is the site's whole inline-Markdown story and it had a real
      # bug: emphasis and code were matched in one alternation, so a code span
      # whose content contained an asterisk — the curriculum's quoted `"*"` in a
      # key policy — shredded both spans and leaked a literal backtick into the
      # page. smoke-render caught it on the one lesson that wrote that shape.
      # This holds the RULE instead of the corpus, so the next lesson to write it
      # is covered before anyone runs a full render.
      - name: Inline Markdown formatting
        run: npm run test:render-inline
      # The rest of the suite. Every one of these is a plain node run against a
      # module with no React and no DOM, so they cost seconds and need no extra
      # install. They were written because their failure modes are silent — a
      # band table that offers a 90-minute task to someone with 30 minutes, an
      # answer attached to the wrong task, a merge that drops a record — and a
      # silent failure that only a local run can catch is a failure that ships.
      - name: UI logic
        run: npm run test:ui
      - name: Data transfer
        run: npm run test:data
      - name: Notes
        run: npm run test:notes
      - name: Your work
        run: npm run test:work
      - name: Today
        run: npm run test:today
      - name: Lesson search
        run: npm run test:lesson-search
      # One phase carried to another machine, keyed by id rather than position.
      # Narrowing a whole-profile export down to one phase is where a filter can
      # silently drop a note or drag a second phase's progress along, and the
      # import reports success either way. Additive by construction, asserted.
      - name: Single-phase transfer
        run: npm run test:phase-transfer
      # "Where you've been" is the page most able to become a completion-scold,
      # which the design system forbids. Its rows carry no `remaining` or
      # `percent` field at all, so the no-denominator rule is a property of the
      # data rather than of the rendering — asserted here so a rewrite cannot
      # quietly reintroduce a score.
      - name: Path order
        run: npm run test:path-order

  # The only job that needs a real browser engine. Everything in `site` renders to
  # a string and asserts on markup, which cannot see layout, computed CSS, focus
  # survival or a media query — the six views this covers (notes panel, dashboard
  # rail, print stylesheet, Shared, Your work, time budget) were verified
  # structurally for their whole life until this job existed.
  #
  # WHY THIS IS A MATRIX NOW
  # It previously ran once, on the runner's Google Chrome. That is Chromium, and
  # the local runs it was meant to complement used Edge — also Chromium. So the
  # claim "verified in a real browser" rested on two builds of ONE engine, and a
  # defect that appears only in Firefox or WebKit was invisible to every guard in
  # the repository. A second Chromium build is not a second engine.
  #
  # Each leg names its engine through BROWSER_ENGINE, and the script FAILS when a
  # named engine is missing rather than falling through to the other one — so a
  # leg titled "firefox" cannot report a green result that was really Chromium.
  # That assertion is the reason this matrix is worth having at all.
  #
  # WebKit is still absent: it has no headless build a runner can install without
  # a dependency this repository does not take (rule 3), so it remains the
  # honest gap. Two engines is a matrix, not complete coverage.
  browser:
    name: Browser check (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            install: chromium
          - engine: firefox
            install: firefox
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # ubuntu-latest ships Chrome and Firefox preinstalled, but not necessarily
      # at the paths the script looks in, and a runner image change could move
      # them. Installing the one this leg wants makes the leg's precondition
      # explicit rather than inherited — and the script still fails loudly if the
      # engine is not where it should be, so this cannot paper over a missing
      # browser either.
      - name: Ensure ${{ matrix.engine }} is present
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.install }}
          if [ "${{ matrix.engine }}" = "firefox" ]; then
            which firefox || ls -l /usr/bin/firefox* || true
          else
            which google-chrome || which chromium || which chromium-browser || true
          fi
      # The preview server is started and torn down inside the step, because a
      # background process launched in an earlier step is not reliably still
      # listening in a later one.
      - name: Browser check (real engine)
        env:
          BROWSER_NO_SANDBOX: '1'
          BROWSER_CHECK_STRICT: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:4173/ >/dev/null; then
            echo "preview server never came up"
            cat /tmp/preview.log
            kill $PREVIEW_PID 2>/dev/null || true
            exit 1
          fi
          npm run test:browser
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS
